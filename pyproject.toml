[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "north-dflash-training-scaffold"
version = "0.1.0"
description = "CPU-only, architecture-independent DFlash training primitives for North"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.5"]

[project.scripts]
north-dflash = "north_dflash_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
